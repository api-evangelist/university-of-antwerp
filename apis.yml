- aid: university-of-antwerp:brocade
  name: Wander (formerly Brocade) — library platform built by UAntwerpen Library & Archive
  description: >-
    Wander is the integrated library, collection and research-information platform the
    University of Antwerp Library & Archive has built since 1998, when it was called Brocade
    and the department was called Anet. It rebranded to Wander during 2026 — anet.be now
    redirects to www.wander.be — and is offered to universities, archives, museums and
    heritage institutions across Flanders as WanderCollections, WanderResearch,
    WanderReservations and Impala. The application runs at go.wander.be, with
    anet.uantwerpen.be and repository.uantwerpen.be as institution-branded entrances onto the
    same host. There is no public self-service REST API and no published specification; the
    machine-readable surface it exposes is the OAI-PMH interface catalogued separately above.
    Open-source components are published through the anet-be GitHub organisation. This entry
    is the reason this profile is not a normal university profile: it is the institution as
    software vendor, and other institutions in this cohort are its tenants.
  humanURL: https://www.wander.be/en
  baseURL: https://go.wander.be/
