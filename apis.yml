    serves repository.uantwerpen.be and anet.uantwerpen.be; all three are the same host,
    moto.cde.uantwerpen.be. The Wander contact address is "Wander, Bibliotheek & Archief
    UAntwerpen, Stadscampus, Venusstraat 35, 3e verdieping, 2000 Antwerpen" and the site's
    social link is the UAntwerpen Bibliotheek & Archief LinkedIn page. Only the marketing site
    www.wander.be is outsourced, to Webflow. Software the institution writes and hosts.
- aid: university-of-antwerp:blackboard
  name: Blackboard Learn (Anthology) — tenant
  description: >-
    The university's learning management system, running as an Anthology-hosted tenant on the
    institution hostname blackboard.uantwerpen.be. Anthology's Blackboard Learn REST API
    answers there — /learn/api/public/v1/system/version returned HTTP 200 with
    {"learn":{"major":4000,"minor":21,"patch":0,"build":"rel.28+435d029"}}, and
    /learn/api/public/v1/courses returned HTTP 401 "API request is not authenticated." The
    tenancy is a real institutional fact and is recorded; the contract, the OAuth server and
    the engineering are Anthology's, so no Blackboard specification is saved under this
    institution and no LTI or Caliper conformance is credited to it.
  humanURL: https://blackboard.uantwerpen.be/
  baseURL: https://blackboard.uantwerpen.be/learn/api/public/v1/
