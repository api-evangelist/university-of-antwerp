defects_observed:
  - id: metadata-not-well-formed
    severity: low
    detail: >-
      The standalone metadata document served at the entityID is NOT well-formed XML as served.
      The root EntityDescriptor declares xmlns, ds, shibmd, xml and mdui, but the Extensions
      block uses the mdrpi: prefix (mdrpi:RegistrationInfo, mdrpi:RegistrationPolicy) without
      declaring urn:oasis:names:tc:SAML:metadata:rpi. Python's ElementTree rejects it with
      "unbound prefix: line 5, column 8". The fragment is valid inside the federation aggregate,
      where the aggregate root declares mdrpi; the per-entity copy simply lost the declaration.
      Reported as observed, not repaired — the archived copy is a verbatim capture of what the
      university actually serves.
    evidence:
      url: https://idpx.ua.ac.be/idp/shibboleth
      status: 200

related_surfaces:
  - name: Flemish Supercomputer Centre (VSC) account portal
    url: https://account.vscentrum.be/
    status: 200
    note: >-
      The VSC discovery service lists "Universiteit Antwerpen" against this IdP's entityID,
      which is how the entityID was recovered. The portal itself resolves to 157.193.43.57
      (RUGNET1, Universiteit Gent) — it is operated by Ghent University for the five-university
      consortium, so it is a participation, not a University of Antwerp surface.
    x-operator: tenant
