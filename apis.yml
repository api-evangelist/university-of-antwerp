- aid: university-of-antwerp:vsc
  name: Flemish Supercomputer Centre (VSC) participation
  description: >-
    The university is one of the five Flemish university partners in the Vlaams
    Supercomputer Centrum and operates the CalcUA tier-2 cluster locally. The shared account
