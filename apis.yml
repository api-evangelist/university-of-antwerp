---
aid: university-of-antwerp
name: University of Antwerp
description: >-
  The University of Antwerp (Universiteit Antwerpen) is a public research university in
  Antwerp, Belgium. Unusually for this cohort it is a producer as well as a buyer: the
  library and archive department builds Wander — the platform that began in 1998 as Brocade
  — and hosts it on the university's own infrastructure, so a vendor-looking domain
  (go.wander.be) resolves to 143.169.239.17 inside inetnum 143.169.0.0/16, netname UA, org
  "Universiteit Antwerpen" (RIPE). Other Flemish institutions are its tenants, not the other
  way round. Two institution-operated machine-readable surfaces were verified live in
  September 2026, both in that same address space. The Institutional Repository University of
  Antwerp (IRUA) serves a complete OAI-PMH 2.0 interface at repository.uantwerpen.be with six
  metadata formats (including CERIF 1.5, MARC 21 and Flemish VABB-SHW and FWO MODS profiles),
  four harvesting sets, ORCID iDs usable as set specifications, and deletedRecord=persistent.
  The Shibboleth identity provider publishes a signed SAML 2.0 EntityDescriptor at the legacy
  entityID https://idpx.ua.ac.be/idp/shibboleth, registered in the Belnet R&E Federation since
  2012 and interfederated into eduGAIN; it is the strongest contract in this profile, it is
  institution-run on institution hardware, and the June 2026 pass missed it entirely.
  What the university does NOT operate is equally clear and is stated rather than padded:
  there is no developer portal, no API key programme, no open data portal (data.uantwerpen.be
  and api.uantwerpen.be do not resolve), no OpenAPI or AsyncAPI of its own, and no
  machine-readable course catalog — the programme catalog is HTML only. The learning
  management system is Anthology's Blackboard running as a tenant on
  blackboard.uantwerpen.be, whose REST API answers on the university's hostname but is
  Anthology's contract, not the university's. DOIs are registered through Crossref (member
  29262); there is no DataCite membership.
