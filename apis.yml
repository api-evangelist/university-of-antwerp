x-coverage:
  state: covered
  reason: covered
  detail: >-
    Two institution-operated machine-readable surfaces confirmed live and confirmed
    institution-owned by IP, not by hostname: the IRUA OAI-PMH interface at
    repository.uantwerpen.be and the Shibboleth SAML 2.0 identity provider at
    idpx.ua.ac.be, both resolving into inetnum 143.169.0.0/16, netname UA, org "Universiteit
    Antwerpen" (RIPE). Neither is published by the university as a specification — the OpenAPI
    in this repo is ours and is marked derived — but both answer real machine-readable
    contracts, which is more than most of this cohort has. Four education-regime standards are
    evidenced from those two surfaces (oai-pmh, saml, shibboleth, orcid) plus a Crossref
    membership; DataCite is a confirmed negative.
    The June 2026 pass missed the identity provider entirely, because its entityID carries the
    university's pre-2011 domain ua.ac.be and no host-matching audit against uantwerpen.be can
    see it. It also described the library platform as documentation behind a URL that now
    404s: Anet/Brocade rebranded to Wander during 2026, and the correction that matters is
    that go.wander.be resolves into the university's own address space, making this institution
    a producer of library software whose customers are other institutions in this cohort.
    What is genuinely absent is stated rather than padded. No developer portal, no API key
    programme, no OpenAPI or AsyncAPI published by the university, no open data portal, no
    machine-readable course catalog, no llms.txt and no security.txt. data.uantwerpen.be,
    api.uantwerpen.be and sisa.uantwerpen.be do not resolve at all. The learning management
    system is Anthology's Blackboard on a CNAME tenancy and its REST API, live on a
    uantwerpen.be hostname, is deliberately not credited here.
