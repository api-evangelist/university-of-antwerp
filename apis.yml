  x-operator: institution
  x-operator-basis: >-
    idpx.ua.ac.be and idpx.uantwerpen.be both CNAME to idp.uantwerpen.be and resolve to
    143.169.245.77, inside the university's own RIPE allocation (143.169.0.0/16, netname UA,
    org "Universiteit Antwerpen"). No CNAME off institution infrastructure and no managed-IdP
    pattern of the AAF Rapid IdP kind that made Monash's IdP a tenant. The metadata's own
    mdui:IPHint declares the same netblock, and the SSO endpoint serves a branded
    "Universiteit Antwerpen Login Service" page from that host.
- aid: university-of-antwerp:belnet-federation
  name: Belnet R&E Federation membership
  description: >-
    The Belgian national research and education identity federation, operated by Belnet, in
    which the university's identity provider is registered. The registration is asserted
