source: >-
  Live fetch of https://idpx.ua.ac.be/idp/shibboleth on 2026-09-01 (HTTP 200,
  application/xml;charset=utf-8, 16,305 bytes), archived verbatim alongside this file as
  university-of-antwerp-idp-saml-metadata.xml; the discovery service at
  https://account.vscentrum.be/ (HTTP 200), whose WAYF list names "Universiteit Antwerpen"
  against entityID https://idpx.ua.ac.be/idp/shibboleth; and RIPE whois / DNS resolution of
  every host involved, to settle who operates the thing the metadata describes.
description: >-
  The University of Antwerp's SAML 2.0 identity federation surface. This is the strongest
  machine-readable contract in the whole profile, it is institution-operated, and it was
  entirely absent from the June 2026 pass — exactly the class the university cohort was
  most completely missing.

  Operator was settled by IP ownership, not by hostname, and the check confirms rather than
  overturns the hostname reading. idpx.ua.ac.be and idpx.uantwerpen.be both CNAME to
  idp.uantwerpen.be and resolve to 143.169.245.77, inside inetnum
  143.169.0.0 - 143.169.255.255, netname UA, org ORG-UA448-RIPE "Universiteit Antwerpen",
  Prinsstraat 13, 2000 Antwerpen (RIPE, mnt-by BELNET-MNT). There is no CNAME off university
  infrastructure and no managed-IdP pattern of the kind that made Monash's IdP a tenant of
  AAF Rapid IdP. The metadata corroborates itself: its mdui:IPHint elements declare
  143.169.0.0/16, 143.129.0.0/16 and 146.175.0.0/16 as the institution's own address space.

  The entity is registered by the Belnet R&E Federation (registrationAuthority
  http://federation.belnet.be/, registrationInstant 2012-03-27), the Belgian national
  research and education identity federation, which interfederates into eduGAIN. Belnet
  operates the federation; the University of Antwerp operates this identity provider inside it.

  Note the legacy entityID. The SAML entityID is a permanent name, not a URL to be tidied,
  so it still carries the university's pre-2011 domain ua.ac.be even though every service
  endpoint in the document now points at idpx.uantwerpen.be. An audit that judges this
  surface by matching hostnames against the repo's declared domain (uantwerpen.be) will miss
  it — the same false-negative shape that hid Washington's uw.edu specs.

