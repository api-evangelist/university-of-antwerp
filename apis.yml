apis:
- aid: university-of-antwerp:irua-oai-pmh
  name: IRUA OAI-PMH Metadata Interface
  description: >-
    Open Archives Initiative Protocol for Metadata Harvesting 2.0 interface for the
    Institutional Repository University of Antwerp (IRUA). Verified live on 2026-09-01:
    Identify returns repositoryName "Institutional Repository University of Antwerp (IRUA)",
    protocolVersion 2.0, earliestDatestamp 2002-12-31, deletedRecord persistent, granularity
    YYYY-MM-DD. ListMetadataFormats advertises six prefixes (oai_dc, marc21, catxml, vabbmods,
    fwomods, cerif); ListSets advertises four sets, two of them parameterised templates that
    make an ORCID iD or a free-text query a valid harvesting scope; ListRecords on the
    OpenAIRE set returned 2,826,135 bytes of real records; GetRecord returns Dublin Core with
    COAR/OpenAIRE access-rights vocabulary, a DOI, a Handle under prefix 10067 and a direct
    fulltext URL. Errors are returned as HTTP 200 with an <error> element. The university
    publishes no specification for this endpoint; the OpenAPI here is ours, marked derived.
  humanURL: https://www.uantwerpen.be/en/library/research/academic-bibliography/
  baseURL: https://repository.uantwerpen.be/oai/abua/
